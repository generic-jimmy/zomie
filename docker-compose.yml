# php2shell C2 console
# host networking keeps the TryHackMe VPN routes and lets targets reach the
# callback listener (reverse-shell mode) on the host's VPN interface.
services:
  php2shell-c2:
    build: .
    image: php2shell-c2:latest
    container_name: php2shell-c2
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: "3000"
      P2S_AGENT_PORT: "47017"
    # If you must use a bridge network instead, publish the ports and make sure
    # the reverse-shell callback IP is your HOST's VPN IP, and forward 4444/tcp:
    # ports:
    #   - "3000:3000"
    #   - "4444:4444"
